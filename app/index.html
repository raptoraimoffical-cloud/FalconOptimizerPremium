<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'" />
  <title>Falcon Optimizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M2 9.5 16 15l14-5.5-6.2 9.3L16 29l-7.8-10.2z" /><path class="brand-eye" d="M16 15 9.8 12.6 16 3l6.2 9.6z" /></svg>
        <div>
          <div class="brand-name">FALCON</div>
          <div class="brand-sub">Optimizer <span id="appVersion"></span></div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item" data-route="dashboard"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/></svg>Dashboard</button>
        <button class="nav-item" data-route="tweaks"><svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2zm0-12v2h10V5zm10 16v-2h8v-2h-8v-2h-2v6zM7 9v2H3v2h4v2h2V9zm14 4v-2H11v2zm-6-4h2V7h4V5h-4V3h-2z"/></svg>Tweaks</button>
        <button class="nav-item" data-route="speedboost"><svg viewBox="0 0 24 24"><path d="M16 11h-1V3a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v8H8a5 5 0 0 0-5 5v7h18v-7a5 5 0 0 0-5-5m3 10h-2v-3a1 1 0 0 0-2 0v3h-2v-3a1 1 0 0 0-2 0v3H9v-3a1 1 0 0 0-2 0v3H5v-5a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3z"/></svg>Speed Boost</button>
        <button class="nav-item" data-route="games"><svg viewBox="0 0 24 24"><path d="M21 6H3a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2m-10 7H8v3H6v-3H3v-2h3V8h2v3h3zm4.5 2a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m4-3a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/></svg>Games</button>
        <button class="nav-item" data-route="tools"><svg viewBox="0 0 24 24"><path d="m22.7 19-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4"/></svg>Tools</button>
        <button class="nav-item" data-route="history"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.9 3.9.1.1L9 12H6a7 7 0 1 1 2.1 5l-1.4 1.4A9 9 0 1 0 13 3m-1 5v5l4.3 2.5.7-1.2-3.5-2.1V8z"/></svg>History</button>
        <button class="nav-item" data-route="settings"><svg viewBox="0 0 24 24"><path d="M19.1 12.9a7 7 0 0 0 0-1.8l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.6-.9L14.7 3h-4l-.4 2.6a7 7 0 0 0-1.6.9l-2.5-1-2 3.5 2.1 1.6a7 7 0 0 0 0 1.8l-2.1 1.6 2 3.5 2.5-1a7 7 0 0 0 1.6.9l.4 2.6h4l.4-2.6a7 7 0 0 0 1.6-.9l2.5 1 2-3.5zM12.7 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7"/></svg>Settings</button>
      </nav>
      <div class="sidebar-foot">
        <button class="preset-chip" id="presetChip" title="Change preset on the Dashboard"></button>
        <div class="admin-state" id="adminState"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSub" class="muted"></p>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>
      <div class="banner" id="banner" hidden></div>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" id="modalClose" aria-label="Close">✕</button>
      </header>
      <div class="modal-body" id="modalBody"></div>
      <footer class="modal-foot" id="modalFoot"></footer>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
